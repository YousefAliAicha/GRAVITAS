name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write private easter-egg config
        env:
          EASTER_EGGS_CONFIG: ${{ secrets.EASTER_EGGS_CONFIG }}
        run: |
          if [ -z "$EASTER_EGGS_CONFIG" ]; then
            echo "Set repo secret EASTER_EGGS_CONFIG to the contents of easter-eggs.config.js" >&2
            exit 1
          fi
          printf '%s\n' "$EASTER_EGGS_CONFIG" > js/config/easter-eggs.config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
