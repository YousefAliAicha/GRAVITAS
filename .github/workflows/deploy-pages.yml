name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply easter-egg config override (optional)
        env:
          EASTER_EGGS_CONFIG: ${{ secrets.EASTER_EGGS_CONFIG }}
        run: |
          if [ -n "$EASTER_EGGS_CONFIG" ]; then
            printf '%s\n' "$EASTER_EGGS_CONFIG" > js/config/easter-eggs.config.js
            echo "Wrote easter-eggs.config.js from EASTER_EGGS_CONFIG secret"
          elif [ -f js/config/easter-eggs.config.js ]; then
            echo "Using committed js/config/easter-eggs.config.js"
          else
            echo "Missing easter-eggs.config.js and secret; copying example placeholders" >&2
            cp js/config/easter-eggs.config.example.js js/config/easter-eggs.config.js
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
